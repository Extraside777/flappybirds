<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Flappy Bird">
<meta name="theme-color" content="#000000">
<title>Flappy Bird</title>
<link rel="icon" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #000;
    overflow: hidden;
    overscroll-behavior: none;
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
  }
  canvas {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    touch-action: none;
  }
  /* -- скільки згори займає виріз камери: гра читає це значення і ставить HUD нижче */
  #safe {
    position: fixed;
    top: 0;
    padding-top: env(safe-area-inset-top);
    visibility: hidden;
    pointer-events: none;
  }
  #loading {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    font: 600 18px system-ui, -apple-system, sans-serif;
    background: #4ec0ea;
  }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="safe"></div>
<div id="loading">Flappy Bird…</div>
<script type="module" src="js/main.js"></script>
</body>
</html>
