plugins {
    id 'com.android.application'
}

// -- ключ для підпису release-APK: android/keystore.properties (в git не потрапляє).
// -- Якщо файлу нема -- release підписується debug-ключем, щоб APK все одно ставився на телефон
def keystoreFile = rootProject.file('keystore.properties')
def keystore = new Properties()
if (keystoreFile.exists()) {
    keystoreFile.withInputStream { keystore.load(it) }
}

// -- реклама AdMob: ID застосунку і рекламного блоку -- android/admob.properties (як отримати -- README).
// -- Без файлу -- тестові ID Google; debug-збірка завжди показує тестову рекламу
def TEST_APP_ID = 'ca-app-pub-3940256099942544~3347511713'
def TEST_REWARDED_ID = 'ca-app-pub-3940256099942544/5224354917'
def admob = new Properties()
def admobFile = rootProject.file('admob.properties')
if (admobFile.exists()) {
    admobFile.withInputStream { admob.load(it) }
}

android {
    namespace 'com.extraside.flappybird'
    compileSdk 35

    defaultConfig {
        applicationId 'com.extraside.flappybird'
        minSdk 24          // -- Android 7.0: менше не підтримує Google Mobile Ads SDK
        targetSdk 35
        versionCode 2
        versionName '1.1'
        manifestPlaceholders = [admobAppId: admob.getProperty('appId', TEST_APP_ID)]
    }

    buildFeatures {
        buildConfig true
    }

    signingConfigs {
        release {
            if (keystoreFile.exists()) {
                storeFile rootProject.file(keystore['storeFile'])
                storePassword keystore['storePassword']
                keyAlias keystore['keyAlias']
                keyPassword keystore['keyPassword']
            }
        }
    }

    buildTypes {
        debug {
            buildConfigField 'String', 'REWARDED_ID', "\"${TEST_REWARDED_ID}\""
        }
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
            signingConfig keystoreFile.exists() ? signingConfigs.release : signingConfigs.debug
            buildConfigField 'String', 'REWARDED_ID', "\"${admob.getProperty('rewardedId', TEST_REWARDED_ID)}\""
        }
    }

    // -- спрайти, музика, звуки і шрифт беруться прямо з assets/ гри на пайтоні -- одне джерело для обох версій
    sourceSets {
        main {
            assets.srcDirs = ['../../assets']
        }
    }
    androidResources {
        // -- стандартний список + assets/images (вихідні картинки для tools/, у грі не потрібні)
        ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:<dir>_*:!CVS:!thumbs.db:!picasa.ini:!*~:!images'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    // -- тест-прогін на комп'ютері (Robolectric): гра малює всі екрани в app/build/screens/*.png
    testOptions {
        unitTests {
            includeAndroidResources = true
        }
    }
}

dependencies {
    implementation 'com.google.android.gms:play-services-ads:25.5.0'          // -- реклама Google (AdMob)
    implementation 'com.google.android.ump:user-messaging-platform:4.0.0'     // -- згода на рекламу (ЄС/Велика Британія)
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.14.1'
}
